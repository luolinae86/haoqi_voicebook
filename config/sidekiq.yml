:concurrency: 16
:queues:
  - payment
  - default
  - import
  - export
  - mailers
  - push
:timeout: 25
:schedule:
  analytics_daily_aggregation:
    cron: '0 2 * * *'
    class: AnalyticsDailyAggregationWorker
    queue: default
  stats_daily_aggregation:
    cron: '5 2 * * *'
    class: StatsDailyAggregationWorker
    queue: default