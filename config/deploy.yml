# Kamal 部署配置
# 用于将 VoiceBook 部署到阿里云服务器

service: voicebook
image: voicebook/voicebook

# ==================== 服务器配置 ====================
# 单 web 服务器 + 单 worker 服务器
# 8.136.142.85 已改为测试服务器（见 deploy.staging.yml）
servers:
  web:
    hosts:
      - 114.215.208.190
  worker:
    hosts:
      - 114.215.208.190
    cmd: "bundle exec sidekiq -C config/sidekiq.yml"

# ==================== Docker Registry 配置 ====================
registry:
  server: reg.ylb.im
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# ==================== 环境变量 ====================
env:
  clear:
    RAILS_ENV: production
    WEB_CONCURRENCY: 4
    RAILS_MAX_THREADS: 5
    DATABASE_POOL_SIZE: 100
    TZ: Asia/Shanghai
  secret:
    # 生产环境数据库
    - DATABASE_PRD_USERNAME
    - DATABASE_PRD_PASSWORD
    - DATABASE_PRD_HOST
    - DATABASE_PRD_PORT
    - DATABASE_PRD_DATABASE
    # 测试环境数据库
    - DATABASE_DEV_USERNAME
    - DATABASE_DEV_PASSWORD
    - DATABASE_DEV_HOST
    - DATABASE_DEV_PORT
    - DATABASE_DEV_DATABASE
    - SECRET_KEY_BASE
    - ALIYUN_ACCESS_KEY_ID
    - ALIYUN_ACCESS_KEY_SECRET
    - OSS_BUCKET_NAME
    - OSS_ENDPOINT
    - OSS_STS_ROLE_ARN
    - REDIS_URL
    - REDIS_PASSWORD
    - DOCS_USERNAME
    - DOCS_PASSWORD
    - WECHAT_APP_ID
    - WECHAT_APP_SECRET
    - QQ_APP_ID
    - QQ_APP_KEY
    - ALIPAY_APP_ID
    - ALIPAY_PRIVATE_KEY
    - ALIPAY_RESPONSE_PUBLIC_KEY
    - ALIPAY_NOTIFY_URL
    - WECHAT_MCH_ID
    - WECHAT_API_CERT
    - WECHAT_API_CERT_SERIAL
    - WECHAT_NOTIFY_URL
    - WECHAT_PLATFORM_CERT
    # 个推推送
    - GE_TUI_APP_ID
    - GE_TUI_APP_KEY
    - GE_TUI_MASTER_SECRET

# ==================== SSH 配置 ====================
ssh:
  user: root
  port: 22
  keys:
    - /Users/luolin/.ssh/id_rsa

# ==================== kamal-proxy 代理 ====================
# SSL 由阿里云 SLB 处理（将 443 流量分发到 web 服务器的 80 端口）
proxy:
  ssl: true
  host: api.zheliyuedu.cn
  healthcheck:
    path: /up
    interval: 5
    timeout: 10
  response_timeout: 60

# ==================== 部署超时与优雅下线 ====================
# 数据库迁移时间较长，增加到 90 秒
deploy_timeout: 90
# 旧容器停止前等待的时间，确保在途请求完成
drain_timeout: 30
# 保留最近 2 个版本，便于快速回滚
retain_containers: 2

# ==================== 构建配置 ====================
# 本地构建（Mac ARM → Linux AMD64），避免在生产服务器 build 导致 OOM
# 生产服务器仅 1.6GB 内存，bundle install 需要 ~750MB，会触发 OOM Killer
builder:
  local: true
  arch: amd64
  cache:
    type: registry

# ==================== 数据卷挂载 ====================
volumes:
  - /voicebook/log:/rails/log
