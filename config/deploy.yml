# Kamal 部署配置
# 用于将 VoiceBook 部署到阿里云服务器

service: voicebook
image: voicebook/voicebook

# ==================== 服务器配置 ====================
servers:
  web:
    hosts:
      - 114.215.208.190
  worker:
    hosts:
      - 114.215.208.190
    cmd: "bundle exec sidekiq -C config/sidekiq.yml"
    healthcheck:
      cmd: "exit 0"

# ==================== Docker Registry 配置 ====================
registry:
  server: reg.ylb.im
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# ==================== 环境变量 ====================
env:
  clear:
    RAILS_ENV: production
    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 5
    TZ: Asia/Shanghai
  secret:
    - SECRET_KEY_BASE
    - DATABASE_PRD_USERNAME
    - DATABASE_PRD_PASSWORD
    - DATABASE_PRD_HOST
    - DATABASE_PRD_PORT
    - DATABASE_PRD_DATABASE
    - ALIYUN_ACCESS_KEY_ID
    - ALIYUN_ACCESS_KEY_SECRET
    - REDIS_URL
    - REDIS_PASSWORD

# ==================== SSH 配置 ====================
ssh:
  user: root
  port: 22
  keys:
    - /Users/luolin/.ssh/id_rsa

# ==================== kamal-proxy 代理 ====================
proxy:
  ssl: true
  host: api.zheliyuedu.cn
  healthcheck:
    path: /up
    interval: 5
    timeout: 5

# ==================== 构建配置 ====================
# 远端构建：在阿里云服务器上 build，解决国内拉取 Docker Hub 镜像慢的问题
builder:
  arch: amd64

# ==================== 数据卷挂载 ====================
volumes:
  - /voicebook/log:/rails/log
