# Kamal 测试环境部署配置
# 部署到测试服务器 8.136.142.85，使用独立域名 apitest.zheliyuedu.cn

service: voicebook-staging
image: voicebook/voicebook-staging

# ==================== 服务器配置 ====================
servers:
  web:
    hosts:
      - 8.136.142.85
  worker:
    hosts:
      - 8.136.142.85
    cmd: "bundle exec sidekiq -C config/sidekiq.yml"

# ==================== Docker Registry 配置 ====================
registry:
  server: reg.ylb.im
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# ==================== 环境变量 ====================
env:
  clear:
    RAILS_ENV: production
    WEB_CONCURRENCY: 1
    RAILS_MAX_THREADS: 3
    TZ: Asia/Shanghai
  secret:
    - SECRET_KEY_BASE
    - DATABASE_DEV_HOST
    - DATABASE_DEV_PORT
    - DATABASE_DEV_USERNAME
    - DATABASE_DEV_PASSWORD
    - DATABASE_DEV_DATABASE
    - ALIYUN_ACCESS_KEY_ID
    - ALIYUN_ACCESS_KEY_SECRET
    - OSS_BUCKET_NAME
    - OSS_ENDPOINT
    - OSS_STS_ROLE_ARN
    - REDIS_URL
    - REDIS_PASSWORD

# ==================== SSH 配置 ====================
ssh:
  user: root
  port: 22
  keys:
    - /Users/luolin/.ssh/id_rsa

# ==================== 部署超时与优雅下线 ====================
deploy_timeout: 90
drain_timeout: 30
# 与 production 保持一致，防止小服务器资源累积
retain_containers: 2

# ==================== 构建配置 ====================
builder:
  arch: amd64
  cache:
    type: registry

# ==================== 数据卷挂载 ====================
volumes:
  - /voicebook-staging/log:/rails/log

# ==================== kamal-proxy 代理 ====================
proxy:
  ssl: true
  host: testvoicebook.haoqiniu.com
  healthcheck:
    path: /up
    interval: 5
    timeout: 5
