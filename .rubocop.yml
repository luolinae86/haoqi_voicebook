plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/migrate/*.rb"
    - "vendor/**/*"
    - "node_modules/**/*"
    - "config/**/*"
    - "log/**/*"
    - "tmp/**/*"
    - "public/**/*"
    - "storage/**/*"

Layout/LineLength:
  Max: 220

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/AbcSize:
  Max: 150

Metrics/MethodLength:
  Max: 150

Metrics/CyclomaticComplexity:
  Max: 20

Metrics/PerceivedComplexity:
  Max: 20

Metrics/ParameterLists:
  Enabled: false

Naming/MethodParameterName:
  MinNameLength: 1

Lint/UnusedBlockArgument:
  Enabled: false

Lint/UnusedMethodArgument:
  Enabled: false

Lint/UselessConstantScoping:
  Enabled: false

Lint/RedundantDirGlobSort:
  Enabled: false

Lint/NoReturnInBeginEndBlocks:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/FrozenStringLiteralComment:
  Enabled: false

Style/MultilineBlockChain:
  Enabled: false

Style/RedundantFreeze:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

Style/ComparableClamp:
  Enabled: false

Style/StringConcatenation:
  Enabled: false

Style/RedundantEach:
  Enabled: false

Style/OptionalBooleanParameter:
  Enabled: false

Style/HashEachMethods:
  Enabled: false

Style/ArrayIntersect:
  Enabled: false

Rails:
  Enabled: true

Rails/I18nLocaleTexts:
  Enabled: false

Rails/SkipsModelValidations:
  Enabled: false

Rails/UniqueValidationWithoutIndex:
  Enabled: false

Rails/InverseOf:
  Enabled: false

Rails/FindByOrAssignmentMemoization:
  Enabled: false

Rails/RedundantPresenceValidationOnBelongsTo:
  Enabled: false

Rails/WhereRange:
  Enabled: false

Rails/Output:
  Enabled: false

Rails/Pluck:
  Enabled: false

Rails/Blank:
  Enabled: false

RSpec/DescribeClass:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/AnyInstance:
  Enabled: false

RSpec/IndexedLet:
  Enabled: false

RSpec/BeEq:
  Enabled: false

RSpec/ContextWording:
  Enabled: false

RSpec/DescribedClass:
  Enabled: false

RSpec/LetSetup:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/PendingWithoutReason:
  Enabled: false

RSpec/VerifiedDoubleReference:
  Enabled: false

RSpec/ReceiveMessages:
  Enabled: false
