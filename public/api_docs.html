<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>狸狸阅读 API 文档</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
<style>
  body { background: #f5f5f5; }
  .topbar { background: linear-gradient(135deg, #6366f1, #8b5cf6); padding: 16px 0; }
  .topbar h1 { color: #fff; font-size: 22px; margin: 0; padding: 0 20px; }
  .topbar p { color: rgba(255,255,255,.8); font-size: 13px; margin: 4px 20px 0; }
  #server-bar { background: #1e293b; color: #e2e8f0; padding: 8px 20px; font-size: 13px; display: flex; align-items: center; gap: 12px; }
  #server-bar label { color: #94a3b8; }
  #server-bar input { background: #0f172a; border: 1px solid #475569; color: #e2e8f0; padding: 4px 10px; border-radius: 4px; width: 300px; font-family: monospace; font-size: 13px; }
  #server-bar input:focus { outline: none; border-color: #6366f1; }
  #server-bar button { background: #6366f1; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<div class="topbar">
  <h1>狸狸阅读 API 文档</h1>
  <p>代码变更后自动更新 · 支持在线调试 · <a href="/api/swagger_doc" target="_blank">查看 OpenAPI JSON 规范</a></p>
</div>
<div id="server-bar">
  <label>API 地址</label>
  <input id="server-url" value="" />
  <button onclick="reloadSpec()">刷新文档</button>
</div>
<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  const baseUrl = window.location.origin;
  document.getElementById('server-url').value = baseUrl;

  function makeRequest(url, options) {
    // Intercept requests to rewrite URLs through the configured server
    const server = document.getElementById('server-url').value.replace(/\/$/, '');
    const parsed = new URL(url, server);
    return fetch(parsed.toString(), options);
  }

  const ui = SwaggerUIBundle({
    url: baseUrl + '/api/swagger_doc',
    dom_id: '#swagger-ui',
    deepLinking: true,
    presets: [SwaggerUIBundle.presets.apis],
    layout: 'BaseLayout',
    docExpansion: 'list',
    filter: true,
    displayRequestDuration: true,
    showExtensions: true,
    showCommonExtensions: true,
    supportedSubmitMethods: ['get', 'post', 'put', 'delete', 'patch', 'options'],
    requestInterceptor: (req) => {
      const server = document.getElementById('server-url').value.replace(/\/$/, '');
      const parsed = new URL(req.url);
      if (!parsed.host || parsed.protocol === 'about:') {
        req.url = server + parsed.pathname + parsed.search;
      }
      return req;
    },
  });
</script>
</body>
</html>
